name: Build Release Artifact

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - README.md
      - README.zh-CN.md
      - LICENSE
      - src/codelux/__init__.py
      - .github/workflows/build.yml
      - scripts/check_public_repository.py
      - scripts/release_artifacts.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build backend
        run: python -m pip install poetry-core==2.2.1
      - name: Verify public repository policy
        run: python scripts/check_public_repository.py
      - name: Verify package version contract
        id: version
        run: |
          VERSION=$(python - <<'PY'
          import pathlib
          import tomllib
          import sys

          root = pathlib.Path.cwd()
          metadata = tomllib.loads((root / "pyproject.toml").read_text())
          sys.path.insert(0, str(root / "src"))
          from codelux import __version__

          declared = metadata["tool"]["poetry"]["version"]
          if declared != __version__:
              raise SystemExit(f"version mismatch: {declared} != {__version__}")
          print(declared)
          PY
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build wheel and sdist
        run: |
          mkdir -p release/dist release/metadata
          python -m pip wheel --no-deps --no-build-isolation --wheel-dir release/dist .
          python - <<'PY'
          from poetry.core.masonry.api import build_sdist
          from pathlib import Path

          output = Path("release/dist")
          build_sdist(str(output))
          PY
      - name: Generate immutable manifest
        run: |
          python scripts/release_artifacts.py generate \
            --dist release/dist \
            --metadata release/metadata \
            --version "${{ steps.version.outputs.version }}" \
            --head-sha "${{ github.sha }}" \
            --build-run-id "${{ github.run_id }}" \
            --repository "${{ github.repository }}" \
            --workflow build.yml
      - name: Verify generated artifact
        run: |
          python scripts/release_artifacts.py verify \
            --dist release/dist \
            --manifest release/metadata/manifest.json \
            --version "${{ steps.version.outputs.version }}" \
            --head-sha "${{ github.sha }}" \
            --build-run-id "${{ github.run_id }}" \
            --repository "${{ github.repository }}" \
            --workflow build.yml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-dist
          path: release/
          if-no-files-found: error
          retention-days: 30

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-matrix:
    name: Test / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: >-
          python -m pip install . pytest==7.4.4 coverage==7.10.7
          "tomli==2.3.0; python_version < '3.11'"
      - name: Run tests with source coverage
        run: coverage run -m pytest -q && coverage report

  test:
    name: test
    needs: test-matrix
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every test matrix entry
        env:
          MATRIX_RESULT: ${{ needs.test-matrix.result }}
        run: test "$MATRIX_RESULT" = success

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
      - name: Install quality tools
        run: >-
          python -m pip install . click==8.1.8 ruff==0.1.15
          mypy==1.19.1 black==23.12.1
      - name: Public repository policy
        run: python scripts/check_public_repository.py
      - name: Ruff
        run: ruff check src tests scripts
      - name: Mypy
        run: mypy src/codelux
      - name: Black
        run: black --check --workers 1 src tests scripts
      - name: Diff check
        run: git diff --check

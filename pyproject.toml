[tool.poetry]
name = "codelux"
version = "0.1.0a11"
description = "Unified Provider management CLI for AI coding assistants"
authors = ["Codelux AI Initiative"]
license = "MIT"
readme = ["README.md", "README.zh-CN.md"]
homepage = "https://github.com/codelux-io/codelux"
repository = "https://github.com/codelux-io/codelux"
keywords = ["ai", "llm", "provider", "claude", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = "^3.9"
click = "^8.1.0"
cryptography = ">=41,<47"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.7.0"
coverage = "^7.6.0"
tomli = { version = "^2.0.0", python = "<3.11" }

[tool.poetry.scripts]
codelux = "codelux.cli:main"

[build-system]
requires = ["poetry-core==2.2.1"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py39"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/codelux"]

[tool.coverage.report]
fail_under = 90
precision = 2
show_missing = true
